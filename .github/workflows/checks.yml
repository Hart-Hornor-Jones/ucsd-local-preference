name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  data:
    name: data integrity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pandas
        run: python -m pip install --upgrade pip pandas
      - name: Run data integrity checks
        run: python tests/check_data.py

  render:
    name: render check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
      - name: Run render check
        run: python tests/render_check.py --screenshot-dir render-screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-screenshots
          path: render-screenshots
          if-no-files-found: ignore
